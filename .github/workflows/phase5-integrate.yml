name: Phase5 integrate

on:
  push:
    branches: [phase5-productization]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Normalize generated source and packaging scripts
        run: |
          git ls-files '*.go' -z | xargs -0 -r gofmt -w
          chmod +x scripts/package-appimage.sh scripts/package-tarball.sh packaging/appimage/AppRun
      - name: Commit integration changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: normalize phase 5 sources'
          git push
