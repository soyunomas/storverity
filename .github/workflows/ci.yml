name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum
      - name: Makefile help smoke test
        run: make help >/dev/null
      - name: Go validation
        run: make ci-go

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend validation
        run: make ci-frontend

  desktop-package-smoke:
    runs-on: ubuntu-24.04
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux desktop dependencies
        run: make linux-deps
      - name: Desktop build smoke test
        env:
          VERSION: 0.0.0-ci
          COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: '0'
          BUILD_DATE: '1970-01-01T00:00:00Z'
        run: make ci-desktop
      - name: Package smoke test
        env:
          VERSION: 0.0.0-ci
          SOURCE_DATE_EPOCH: '0'
        run: make ci-package
      - name: Upload package smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: storverity-ci-linux-x86_64
          path: dist/*
          if-no-files-found: error
