name: Phase4 integrate

on:
  push:
    branches: [phase4-raw-probe]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Format Go
        run: gofmt -w internal/rawprobe internal/appservice internal/device main.go
      - name: Wire raw probe panel
        run: |
          python3 -c "from pathlib import Path; p=Path('frontend/src/App.svelte'); s=p.read_text(); a=\"  import { onMount } from 'svelte';\\n\"; i=\"  import RawProbePanel from './RawProbePanel.svelte';\\n\"; s=s if i in s else s.replace(a,a+i,1); old='''      <section class=\"raw-banner\">\n        <div><span class=\"lock-icon\">◆</span><div><strong>Raw capacity probe</strong><p>Direct block-device testing remains locked until Phase 4 safety gates are complete.</p></div></div>\n        <span class=\"coming-soon\">Planned</span>\n      </section>'''; new='''      <RawProbePanel device={selected} />'''; s=s.replace(old,new,1) if old in s else s; p.write_text(s)"
          grep -q "RawProbePanel" frontend/src/App.svelte
      - name: Commit integration changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/rawprobe internal/appservice internal/device main.go frontend/src/App.svelte
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: format and wire phase 4 integration'
          git push
